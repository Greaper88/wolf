name: Publish container image

on:
  push:
    branches: [auto-gpu-selection, dev-gpu-selection]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == 'auto-gpu-selection' || github.ref_name == 'dev-gpu-selection'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select image channel
        id: channel
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            auto-gpu-selection) tag=latest ;;
            dev-gpu-selection) tag=gpu-selection-dev ;;
            *) exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Read optional AI provenance from the commit
        id: provenance
        shell: bash
        run: |
          {
            echo 'labels<<AI_PROVENANCE'
            git log -1 --format=%B | git interpret-trailers --parse | awk '
              /^AI-Agent: / {sub(/^AI-Agent: /, ""); print "ai.agent=" $0}
              /^AI-Model-Version: / {sub(/^AI-Model-Version: /, ""); print "ai.model-version=" $0}
              /^AI-Inference-Date: / {sub(/^AI-Inference-Date: /, ""); print "ai.inference-date=" $0}
            '
            echo 'AI_PROVENANCE'
          } >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.channel.outputs.image }}
          tags: |
            type=raw,value=${{ steps.channel.outputs.tag }}
            type=sha,format=long,prefix=sha-
          flavor: latest=false
          labels: |
            org.opencontainers.image.version=${{ steps.channel.outputs.tag }}
            ${{ steps.provenance.outputs.labels }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wolf.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WOLF_BUILD_JOBS=2
          cache-from: type=gha,scope=${{ steps.channel.outputs.tag }}
          cache-to: type=gha,scope=${{ steps.channel.outputs.tag }},mode=max
